name: Workout UX audit
on:
  push:
    branches: [main, feature/workout-timer-ux]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Timer state regression tests
        run: node --experimental-strip-types --test tests/timer.test.mjs
      - run: npm install --no-save --no-audit --no-fund playwright@1.55.1
      - run: npx playwright install chromium
      - name: Browser regression in isolated demo mode
        shell: bash
        run: |
          mkdir -p test-results
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/de-exercise-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/workout-ux.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workout-ux-results
          path: test-results/
          retention-days: 7
